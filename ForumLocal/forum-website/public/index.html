<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forum Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans" style="font-family: 'Inter', sans-serif;">
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">KomunitasLokal</h1>
    <nav>
      <a href="login.html" class="text-blue-600 hover:underline mr-4">Login</a>
      <a href="register.html" class="text-blue-600 hover:underline mr-4">Register</a>
      <a href="newpost.html" class="text-blue-600 hover:underline">New Post</a>
    </nav>
  </header>
  <main class="max-w-4xl mx-auto p-4">
    <h2 class="text-xl font-semibold mb-4">Topics</h2>
    <div id="posts" class="space-y-4">
    </div>
  </main>
  <footer class="bg-white shadow p-4 text-center text-gray-600 mt-8">
    &copy; 2025 Forum. All rights reserved.
  </footer>

  <script>
    async function fetchPosts() {
      try {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const postsContainer = document.getElementById('posts');
        postsContainer.innerHTML = '';
        if (posts.length === 0) {
          postsContainer.innerHTML = '<p class="text-gray-600">No topics yet. Be the first to create one!</p>';
          return;
        }
        posts.forEach(post => {
          const postEl = document.createElement('div');
          postEl.className = 'bg-white p-4 rounded shadow hover:shadow-md transition-shadow';
          postEl.innerHTML = `
            <a href="topic.html?id=${post.id}" class="text-lg font-semibold text-blue-600 hover:underline">${post.title}</a>
            <p class="text-gray-700 mt-1">${post.content.substring(0, 100)}${post.content.length > 100 ? '...' : ''}</p>
            <p class="text-gray-500 text-sm mt-2">By ${post.username} on ${new Date(post.createdAt).toLocaleString()}</p>
          <p class="text-gray-500 text-sm mt-1">
            <button onclick="votePost(${post.id}, 1)" class="text-green-600 hover:text-green-800 mr-2"><i class="fas fa-thumbs-up"></i> ${post.upvotes ? post.upvotes.length : 0}</button>
            <button onclick="votePost(${post.id}, -1)" class="text-red-600 hover:text-red-800"><i class="fas fa-thumbs-down"></i> ${post.downvotes ? post.downvotes.length : 0}</button>
          </p>
          `;
          postsContainer.appendChild(postEl);
        });
      } catch (error) {
        console.error('Error fetching posts:', error);
      }
    }

    const token = localStorage.getItem('token');

    async function votePost(postId, vote) {
      if (!token) {
        alert('Please login to vote.');
        return;
      }
      try {
        const res = await fetch('/api/vote', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ postId, vote }),
        });
        if (res.ok) {
          fetchPosts();
        }
      } catch (error) {
        console.error('Error voting post:', error);
      }
    }

    fetchPosts();
  </script>
</body>
</html>
