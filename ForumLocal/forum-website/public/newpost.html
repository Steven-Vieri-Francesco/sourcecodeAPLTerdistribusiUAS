<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Post - Forum</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans" style="font-family: 'Inter', sans-serif;">
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">New Post</h1>
    <nav>
      <a href="index.html" class="text-blue-600 hover:underline mr-4">Home</a>
      <a href="login.html" class="text-blue-600 hover:underline" id="logoutLink">Logout</a>
    </nav>
  </header>
  <main class="max-w-4xl mx-auto p-4">
    <form id="postForm" class="bg-white p-6 rounded shadow-md space-y-4" enctype="multipart/form-data">
      <div>
        <label for="title" class="block text-gray-700 font-semibold mb-1">Title</label>
        <input type="text" id="title" name="title" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="content" class="block text-gray-700 font-semibold mb-1">Content</label>
        <textarea id="content" name="content" rows="8" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
      </div>
      <div>
        <label for="files" class="block text-gray-700 font-semibold mb-1">Attach files (images, videos, gifs)</label>
        <input type="file" id="files" name="files" multiple accept="image/*,video/*,audio/*,application/gif" class="w-full" />
      </div>
      <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded hover:bg-blue-700 transition">Create Post</button>
      <p id="errorMsg" class="text-red-600 mt-2 hidden"></p>
      <p id="successMsg" class="text-green-600 mt-2 hidden"></p>
    </form>
  </main>

  <script>
    const postForm = document.getElementById('postForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const logoutLink = document.getElementById('logoutLink');

    // User must login first before posting
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }

    logoutLink.addEventListener('click', (e) => {
      e.preventDefault();
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    postForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');

      const title = postForm.title.value.trim();
      const content = postForm.content.value.trim();

      try {
        const res = await fetch('/api/posts', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ title, content }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.message || 'Failed to create post';
          errorMsg.classList.remove('hidden');
          return;
        }
        successMsg.textContent = 'Post created successfully!';
        successMsg.classList.remove('hidden');
        postForm.reset();
      } catch (error) {
        errorMsg.textContent = 'An error occurred. Please try again.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
